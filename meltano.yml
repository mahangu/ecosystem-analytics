version: 1
default_environment: dev
project_id: ecosystem-analytics

# Daily extract of WordPress.org catalog + ecosystem metadata snapshots.
# The tap is consumed as a dependency — never forked or modified here.
#
# There is no Singer loader on purpose. The daily workflow runs the tap
# with `meltano invoke` and captures its raw Singer output to JSONL, which
# scripts/load_snapshot.py reads straight into DuckDB. `meltano invoke`
# carries no state, so every run is a full extract — required because
# installs/downloads/ratings drift without the tap's `last_updated`
# changing, which an incremental sync would miss.
plugins:
  extractors:
    - name: tap-wordpress-org
      namespace: tap_wordpress_org
      # Pinned to a release tag for reproducible installs.
      pip_url: git+https://github.com/Automattic/tap-wordpress-org.git@0.1.0
      executable: tap-wordpress-org
      capabilities:
        - state
        - catalog
        - discover
        - properties
      config:
        # Seven streams only — "events" is intentionally excluded (it is
        # location-based event listings, not catalog/ecosystem metadata).
        stream_selection:
          - plugins
          - themes
          - patterns
          - wordpress_stats
          - php_stats
          - mysql_stats
          - locale_stats
        # Identifies this pipeline to the WordPress.org API so they have a
        # contact point (the repo's issue tracker) if it ever misbehaves.
        user_agent: "ecosystem-analytics/1.0 (+https://github.com/mahangu/ecosystem-analytics)"
        # Be polite to the API — small gap between requests.
        request_delay: 0.25

environments:
  - name: dev
