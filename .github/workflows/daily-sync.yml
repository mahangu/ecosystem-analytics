name: daily-sync

# Runs the WordPress.org ecosystem extract once a day, loads the result
# into catalog.duckdb, and re-uploads the database as the single asset
# attached to the `data-latest` GitHub release. The release IS the
# storage: there is no database server, and the file never gets committed
# back to the repo (GitHub's 100 MB per-file push limit makes that
# unworkable once the snapshot history grows).

on:
  schedule:
    # 06:00 UTC daily. Use the workflow_dispatch trigger below to run the
    # very first snapshot now rather than waiting for this cron.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Required so the job can create/replace the `data-latest` release asset.
permissions:
  contents: write

# Never let two snapshot runs race on the same release asset.
concurrency:
  group: daily-sync
  cancel-in-progress: false

env:
  RELEASE_TAG: data-latest
  DB_FILE: catalog.duckdb

jobs:
  sync:
    runs-on: ubuntu-latest
    # Cap the run so a hung extract cannot burn the 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install meltano duckdb

      - name: Install Meltano plugins
        run: meltano install

      - name: Download previous snapshot from release
        # First-ever run will find no release; that is fine, load_snapshot.py
        # will create a fresh catalog.duckdb from today's extract.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download "$RELEASE_TAG" --pattern "$DB_FILE" --clobber; then
            echo "Downloaded existing $DB_FILE from release $RELEASE_TAG."
            ls -lh "$DB_FILE"
          else
            echo "No existing $DB_FILE on release $RELEASE_TAG, starting fresh."
          fi

      - name: Extract WordPress.org streams to JSONL
        # Run the tap directly and capture its raw Singer output. No Singer
        # loader is used, load_snapshot.py reads the raw messages itself.
        run: |
          mkdir -p output
          meltano invoke tap-wordpress-org > output/tap-output.jsonl

      - name: Load snapshot into DuckDB
        # load_snapshot.py exits non-zero if the plugins or themes stream
        # produced zero records, which fails the whole run loudly and
        # skips the upload step below, so a broken extract is never stored.
        # It also runs CHECKPOINT at the end to keep the on-disk file
        # compact (the WAL otherwise inflates the file by ~75 MB per run).
        run: python scripts/load_snapshot.py --input output --db "$DB_FILE"

      - name: Upload snapshot to release
        # Replace the asset on the `data-latest` release. If the release
        # does not exist yet (first run), create it with the file attached.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh "$DB_FILE"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DB_FILE" --clobber
            echo "Replaced $DB_FILE on release $RELEASE_TAG."
          else
            gh release create "$RELEASE_TAG" "$DB_FILE" \
              --title "Latest DuckDB snapshot" \
              --notes "Rolling snapshot of catalog.duckdb. Replaced daily by the daily-sync workflow."
            echo "Created release $RELEASE_TAG with $DB_FILE attached."
          fi
