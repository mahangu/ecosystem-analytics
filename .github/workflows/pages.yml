name: Deploy dashboard

# Builds the static dashboard's JSON data from catalog.duckdb and deploys
# the docs/ folder to GitHub Pages. The database itself lives as an
# asset on the `data-latest` GitHub release (see daily-sync.yml), so
# this workflow downloads it fresh at deploy time. docs/data/ is
# gitignored and regenerated here at deploy time, never committed.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ecosystem-analytics-pipeline-pr6VA
    paths:
      - docs/**
      - scripts/export_dashboard.py
      - .github/workflows/pages.yml
  # Redeploy after every daily snapshot so the dashboard always reflects
  # the latest catalog.duckdb.
  workflow_run:
    workflows: ["daily-sync"]
    types: [completed]

# Pages deploys need read access to the repo (to read its release assets
# via gh CLI) plus the OIDC token and pages write scope used by
# deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

env:
  RELEASE_TAG: data-latest
  DB_FILE: catalog.duckdb

# Never let two Pages deploys race; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Skip the deploy if this run was triggered by a FAILED daily-sync.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install duckdb

      - name: Download snapshot from release
        # The DB lives on the `data-latest` GitHub release, not in the
        # repo. Fail fast if there is no asset yet (the dashboard cannot
        # be built without it).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" --pattern "$DB_FILE" --clobber
          ls -lh "$DB_FILE"

      - name: Export dashboard data
        run: python scripts/export_dashboard.py --db "$DB_FILE" --out docs/data

      - name: Configure Pages
        # Pages must be enabled once by hand in Settings -> Pages
        # (Source: GitHub Actions). The GITHUB_TOKEN cannot create the
        # Pages site itself, so this only reads the existing config.
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
